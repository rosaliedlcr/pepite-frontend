<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pépite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2421; --ink-soft:#4A5148; --paper:#FAF7F0; --paper-alt:#EDE6D6; --card:#FFFFFF;
    --mustard:#C9A227; --rust:#A8462B; --sage:#6B7860;
    --line: rgba(31,36,33,0.16); --line-strong: rgba(31,36,33,0.32);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; line-height:1.5; }
  h1,h2{ font-family:'Fraunces', serif; font-weight:500; margin:0; }
  .wrap{ max-width:960px; margin:0 auto; padding:0 20px; }
  header{ padding:20px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .wordmark{ font-size:1.4rem; font-style:italic; }
  nav{ display:flex; gap:6px; background:var(--paper-alt); padding:3px; border-radius:999px; }
  nav button{ border:none; background:transparent; padding:7px 14px; border-radius:999px; font-weight:600; font-size:0.84rem; cursor:pointer; }
  nav button.active{ background:var(--card); }
  .view{ display:none; padding:30px 0; }
  .view.active{ display:block; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px; max-width:480px; }
  .dropzone{ border:1.5px dashed var(--line-strong); border-radius:10px; padding:24px; text-align:center; cursor:pointer; display:block; }
  input[type=file]{ display:none; }
  .btn{ margin-top:10px; width:100%; border:none; background:var(--rust); color:#fff; font-weight:600; padding:12px; border-radius:8px; cursor:pointer; display:block; text-align:center; text-decoration:none; }
  .btn:disabled{ opacity:0.4; }
  .btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--line-strong); }
  .field{ margin-top:12px; }
  .field label{ display:block; font-size:0.8rem; color:var(--ink-soft); margin-bottom:4px; }
  .field input{ width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--line-strong); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .preview{ width:64px; height:64px; border-radius:8px; object-fit:cover; margin-top:10px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin-top:20px; }
  .card{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
  .card img{ width:100%; aspect-ratio:1; object-fit:cover; }
  .card-body{ padding:12px; }
  .card-shop{ font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; }
  .status{ font-size:0.8rem; color:var(--ink-soft); margin-top:8px; }
</style>
</head>
<body>
<header class="wrap">
  <div class="wordmark"><em>Pépite</em></div>
  <nav>
    <button class="active" data-view="search">Chercher</button>
    <button data-view="add">Ajouter une pièce</button>
  </nav>
</header>

<div class="wrap view active" id="view-search">
  <h2>Trouve une pièce similaire</h2>
  <div class="panel">
    <label class="dropzone" for="searchFile">Choisis une photo</label>
    <input type="file" id="searchFile" accept="image/*">
    <label class="btn btn-outline" for="searchFileCam">📷 Prendre une photo</label>
    <input type="file" id="searchFileCam" accept="image/*" capture="environment">
    <img id="searchPreview" class="preview" style="display:none;">
    <div class="status" id="searchStatus"></div>
  </div>
  <div class="grid" id="searchResults"></div>
</div>

<div class="wrap view" id="view-add">
  <h2>Ajouter une pièce repérée en friperie</h2>
  <div class="panel">
    <label class="dropzone" for="addFile">Choisis une photo</label>
    <input type="file" id="addFile" accept="image/*">
    <label class="btn btn-outline" for="addFileCam">📷 Prendre une photo</label>
    <input type="file" id="addFileCam" accept="image/*" capture="environment">
    <img id="addPreview" class="preview" style="display:none;">

    <div class="field-row">
      <div class="field"><label>Friperie</label><input type="text" id="addShop" placeholder="Ex. Guerrisol"></div>
      <div class="field"><label>Taille</label><input type="text" id="addSize" placeholder="Ex. M"></div>
    </div>
    <div class="field"><label>Prix</label><input type="text" id="addPrice" placeholder="Ex. 14 €"></div>
    <div class="field"><label>Adresse (optionnel)</label><input type="text" id="addAddress" placeholder="Ex. 17 bd de la Chapelle"></div>
    <div class="field"><label>Nom (optionnel)</label><input type="text" id="addName" placeholder="Ex. Pull bleu marine"></div>

    <button class="btn" id="addSubmit" disabled>Ajouter au catalogue</button>
    <div class="status" id="addStatus"></div>
  </div>
</div>

<script>
// ⚠️ Remplace cette URL par celle de TON backend une fois déployé sur Render.
const BACKEND_URL = "https://pepite-backend-9kls.onrender.com";

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + b.dataset.view).classList.add('active');
}));

// ---- search flow ----
let searchFile = null;
const searchStatus = document.getElementById('searchStatus');
['searchFile','searchFileCam'].forEach(id => {
  document.getElementById(id).addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    searchFile = f;
    const img = document.getElementById('searchPreview');
    img.src = URL.createObjectURL(f);
    img.style.display = 'block';
    await runSearch();
  });
});

async function runSearch(){
  searchStatus.textContent = 'Recherche en cours…';
  document.getElementById('searchResults').innerHTML = '';
  try{
    const form = new FormData();
    form.append('image', searchFile);
    const res = await fetch(`${BACKEND_URL}/api/search`, { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur serveur');
    searchStatus.textContent = `${data.results.length} résultat(s)`;
    renderResults(data.results);
  } catch(e){
    searchStatus.textContent = "Erreur : " + e.message;
    console.error(e);
  }
}

function renderResults(items){
  const grid = document.getElementById('searchResults');
  grid.innerHTML = items.map(it => `
    <div class="card">
      <img src="${it.image_url}" alt="">
      <div class="card-body">
        <div class="card-shop">${it.shop}</div>
        <div><b>${it.name || it.category || 'Pièce'}</b></div>
        <div>${it.price}${it.size ? ' · taille ' + it.size : ''}</div>
        <div class="status">${Math.round(it.similarity*100)}% de ressemblance</div>
        ${it.address ? `<a class="btn btn-outline" style="margin-top:8px;" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.shop+', '+it.address)}">📍 ${it.address}</a>` : ''}
      </div>
    </div>
  `).join('');
}

// ---- add flow ----
let addFile = null;
const addShop = document.getElementById('addShop');
const addSize = document.getElementById('addSize');
const addPrice = document.getElementById('addPrice');
const addSubmit = document.getElementById('addSubmit');
const addStatus = document.getElementById('addStatus');

['addFile','addFileCam'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    addFile = f;
    const img = document.getElementById('addPreview');
    img.src = URL.createObjectURL(f);
    img.style.display = 'block';
    updateAddBtn();
  });
});
[addShop, addSize, addPrice].forEach(el => el.addEventListener('input', updateAddBtn));
function updateAddBtn(){
  addSubmit.disabled = !(addFile && addShop.value.trim() && addSize.value.trim() && addPrice.value.trim());
}

addSubmit.addEventListener('click', async () => {
  addSubmit.disabled = true;
  addStatus.textContent = 'Envoi en cours…';
  try{
    const form = new FormData();
    form.append('image', addFile);
    form.append('shop', addShop.value.trim());
    form.append('size', addSize.value.trim());
    form.append('price', addPrice.value.trim());
    form.append('address', document.getElementById('addAddress').value.trim());
    form.append('name', document.getElementById('addName').value.trim());
    const res = await fetch(`${BACKEND_URL}/api/items`, { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur serveur');
    addStatus.textContent = 'Ajoutée au catalogue !';
    addShop.value=''; addSize.value=''; addPrice.value='';
    document.getElementById('addAddress').value='';
    document.getElementById('addName').value='';
    document.getElementById('addPreview').style.display='none';
    addFile = null;
  } catch(e){
    addStatus.textContent = "Erreur : " + e.message;
    console.error(e);
  }
  updateAddBtn();
});
</script>
</body>
</html>
